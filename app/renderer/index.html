<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:;" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage" class="state-idle feed-on">
      <!-- speech / status bubble -->
      <div id="bubble" class="bubble">
        <span id="bubble-emoji">💭</span><span id="bubble-text"></span>
      </div>

      <div id="pet" class="pet">
        <!-- overlays -->
        <div class="zzz"><span>z</span><span>z</span><span>z</span></div>
        <div class="sparkles"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="sweat"></div>
        <div class="speedlines"><span></span><span></span><span></span></div>
        <div id="prop" class="prop"></div>

        <!-- wizard on a broom (raster sprite) -->
        <div id="harry">
          <div id="fly">
            <div class="spellglow"></div>
            <div class="sprite"></div>
          </div>
          <div class="shadow"></div>
        </div>
      </div>

      <!-- live activity log -->
      <div id="feed" class="feed">
        <div class="feed-title"><span>✦</span> activity</div>
        <div id="feed-list" class="feed-list">
          <div class="feed-empty">waiting for opencode…</div>
        </div>
      </div>
    </div>

    <script src="pet.js"></script>
  </body>
</html>
